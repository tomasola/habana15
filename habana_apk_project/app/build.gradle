plugins {
    id 'com.android.application'
}

android {
    namespace 'com.habana.tablet'
    compileSdk 34

    defaultConfig {
        applicationId "com.habana.tablet"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero third-party dependencies required: uses Android 34 SDK native WebView and Activity
}
